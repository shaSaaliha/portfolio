        <style>
            /* PDF preview window styles */
            .preview-window {
                /* taller preview so PDF fits without horizontal scrolling */
                height: min(75vh, 900px);
                border: 1px solid #e9ecef;
                border-radius: 0.5rem;
                overflow: hidden; /* hide outer scrollbars; PDF viewer will handle vertical scroll */
                background: #fff;
                display: block;
            }
            .pdf-preview {
                width: 100% !important;
                height: 100% !important;
                border: 0;
                display: block;
                max-width: 100%;
                max-height: 100%;
            }
            @media (max-width: 991px) {
                .preview-window { height: min(60vh, 700px); }
            }
            @media (max-width: 575px) {
                .preview-window { height: 50vh; }
            }
        </style>

            <!-- Page Content-->
            <div class="container px-3 px-md-5 my-5">
                <div class="text-center mb-5">
                    <h1 class="display-6 fw-bolder mb-0"><span class="text-gradient fs-3 d-inline">Resume/CV</span></h1>
                </div>
                <div class="row gx-5 justify-content-center">
                    <div class="col-lg-11 col-xl-9 col-xxl-8">
                        <!-- Experience Section-->
                            <section>

                                <!-- Stacked cards styled like Professional Skills -->
                                <div class="mb-4">

                                    <!-- Resume Card -->
                                    <div class="card shadow border-0 rounded-4 mb-5">
                                        <div class="card-body p-3 p-md-5 d-flex flex-column">
                                            <div class="d-flex justify-content-between align-items-start mb-2">
                                                <h3 class="fw-bolder mb-3"><span class="text-primary d-inline">Resume</span></h3>
                                            </div>
                                            <div class="preview-window mb-3">
                                                <iframe id="resumePreview" class="pdf-preview" src="assets/Saaliha_Allauddin_Resume.pdf" title="Resume preview" scrolling="yes"></iframe>
                                            </div>
                                             <div class="d-flex gap-2 justify-content-end">
                                                 <a class="btn btn-outline-primary" href="#" data-pdf="assets/Saaliha_Allauddin_Resume.pdf" onclick="openPdf(event)">View</a>
                                                 <a class="btn btn-primary" href="assets/Saaliha_Allauddin_Resume.pdf" download>Download</a>
                                             </div>
                                         </div>
                                     </div>
 
                                    <!-- CV Card -->
                                    <div class="card shadow border-0 rounded-4 mb-5">
                                        <div class="card-body p-3 p-md-5 d-flex flex-column">
                                            <div class="d-flex justify-content-between align-items-start mb-2">
                                                <h3 class="fw-bolder mb-3"><span class="text-primary d-inline">CV</span></h3>
                                            </div>
                                            <div class="preview-window mb-3">
                                                <iframe id="cvPreview" class="pdf-preview" src="assets/Saaliha_Allauddin_CV.pdf" title="CV preview" scrolling="yes"></iframe>
                                            </div>
                                            <div class="d-flex gap-2 justify-content-end">
                                                <a class="btn btn-outline-primary" href="#" data-pdf="assets/Saaliha_Allauddin_CV.pdf" onclick="openPdf(event)">View</a>
                                                <a class="btn btn-primary" href="assets/Saaliha_Allauddin_CV.pdf" download>Download</a>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </section>

                            <!-- PDF viewer modal -->
                            <div id="pdfModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1050; align-items:center; justify-content:center;">
                                <div style="position:relative; width:90%; height:90%; background:#fff; border-radius:6px; overflow:hidden;">
                                    <button onclick="closePdf()" aria-label="Close" style="position:absolute; top:8px; right:8px; z-index:2;" class="btn btn-sm btn-light">Close</button>
                                    <iframe id="pdfFrame" src="" style="width:100%; height:100%; border:0;"></iframe>
                                </div>
                            </div>

                            <script>
                                function openPdf(e) {
                                    e.preventDefault();
                                    var pdf = e.currentTarget.getAttribute('data-pdf');
                                    if (!pdf) return;
                                    var frame = document.getElementById('pdfFrame');
                                    frame.src = pdf;
                                    var modal = document.getElementById('pdfModal');
                                    modal.style.display = 'flex';
                                }

                                function closePdf() {
                                    var frame = document.getElementById('pdfFrame');
                                    if (frame) frame.src = '';
                                    var modal = document.getElementById('pdfModal');
                                    if (modal) modal.style.display = 'none';
                                }

                                document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePdf(); });
                                var pdfModal = document.getElementById('pdfModal');
                                if (pdfModal) {
                                    pdfModal.addEventListener('click', function(e) { if (e.target === this) closePdf(); });
                                }
                            </script>
                        <!-- Divider-->
                        <div class="pb-5"></div>
